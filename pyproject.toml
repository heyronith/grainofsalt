[project]
name = "grainofsalt"
version = "0.1.0"
description = "Test whether LLMs retain internal framing representations after fiction/debunk fine-tuning"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=2.1.3,<2.3",
    "pandas>=2.2.3,<2.3",
    "pyyaml==6.0.2",
    "httpx==0.28.1",
    "python-dotenv==1.0.1",
    "transformers>=4.48.3,<4.50",
    "torch>=2.5.1,<2.8",
    "tokenizers>=0.21.0,<0.22",
    "huggingface-hub>=0.28.1,<0.30",
    "datasets>=3.2.0,<3.4",
    "tqdm==4.67.1",
    "scikit-learn>=1.6.1,<1.7",
    "scipy>=1.15.1,<1.16",
    "jsonschema==4.23.0",
    "pyarrow>=19.0.1,<20",
    "modal>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "ruff==0.9.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grainofsalt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
